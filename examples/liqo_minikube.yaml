default:
  runtime:
    type: "minikube"
  cni: "flannel"
  nodes: 2
  cluster_cidr: "10.200.0.0/16"
  service_cidr: "10.71.0.0/16"

clusters:
  - name: "rome"
    cache: true
    namespaces:
      - name: "nlr"
        pods:
          - name: "plr1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "plr2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1
        services:
          - name: "slr1"
            spec:
              selector:
                app: plr1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "slr2"
            spec:
              selector:
                app: plr2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
      - name: "nor"
        pods:
          - name: "porc1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "porc2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1
          - name: "porp1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
          - name: "porp2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
        services:
          - name: "sorc1"
            spec:
              selector:
                app: porc1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sorc2"
            spec:
              selector:
                app: porc2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sorp1"
            spec:
              selector:
                app: porp1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sorp2"
            spec:
              selector:
                app: porp2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
  - name: "milan"
    cache: true
    namespaces:
      - name: "nlm"
        pods:
          - name: "plm1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "plm2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1
        services:
          - name: "slm1"
            spec:
              selector:
                app: plm1
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "slm2"
            spec:
              selector:
                app: plm2
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80

tools:
  - type: "liqo"
    spec:
      installations:
        - cluster: "rome"
          offloadings: ["nor"]
        - cluster: "milan"
      peerings:
        - ["rome", "milan"]
