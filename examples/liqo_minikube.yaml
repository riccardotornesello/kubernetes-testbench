# Same topology as liqo_k3d.yaml, on minikube VMs (kvm2 driver) with
# Cilium: shows the runtime and CNI parameters.
default:
  runtime:
    type: minikube
    spec:
      kubernetes_version: "1.30.0"
      driver: kvm2
      cpus: 2
      memory: 4g
  cni:
    type: cilium
    spec:
      version: "1.18.6"
  nodes: 2

clusters:
  - name: rome
    cluster_cidr: "10.200.0.0/16"
    service_cidr: "10.71.0.0/16"
    namespaces:
      - name: shared
        deployments:
          - name: tester
            replicas: 2
            pod_spec:
              containers:
                - name: tester
                  image: riccardotornesello/hello-world-http-server:v2.1.0-tester
  - name: milan
    cluster_cidr: "10.201.0.0/16"
    service_cidr: "10.72.0.0/16"

tools:
  - type: liqo
    spec:
      installations:
        - cluster: rome
          offloadings: [shared]
        - cluster: milan
      peerings:
        - [rome, milan]
