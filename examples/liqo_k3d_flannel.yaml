default:
  runtime:
    type: "k3d"
  cni: "flannel"
  nodes: 2
  cluster_cidr: "10.200.0.0/16"
  service_cidr: "10.71.0.0/16"

clusters:
  - name: "rome"
    cache: true
    namespaces:
      - name: "nc"
        pods:
          - name: "pc1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "pc2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1
      - name: "no"
        pods:
          - name: "poc1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "poc2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1
          - name: "pop1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
          - name: "pop2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
  - name: "milan"
    cache: true
    namespaces:
      - name: "np"
        pods:
          - name: "pp1"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "pp2"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-1

tools:
  - type: "liqo"
    spec:
      installations:
        - cluster: "rome"
          offloadings: ["no"]
        - cluster: "milan"
      peerings:
        - ["rome", "milan"]
