default:
  runtime:
    type: "k3d"
  cni: "flannel"
  nodes: 2
  cluster_cidr: "10.200.0.0/16"
  service_cidr: "10.71.0.0/16"

clusters:
  - name: "rome"
    cache: true
    namespaces:
      - name: "nlr"
        pods:
          - name: "plr"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slr"
            spec:
              selector:
                app: plr
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
      - name: "no"
        pods:
          - name: "por"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "pom"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
          - name: "pov"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: venice
        services:
          - name: "sor"
            spec:
              selector:
                app: por
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "som"
            spec:
              selector:
                app: pom
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sov"
            spec:
              selector:
                app: pov
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
  - name: "milan"
    cache: true
    namespaces:
      - name: "nlm"
        pods:
          - name: "plm"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slm"
            spec:
              selector:
                app: plm
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
  - name: "venice"
    cache: true
    namespaces:
      - name: "nlv"
        pods:
          - name: "plv"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slv"
            spec:
              selector:
                app: plv
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80

tools:
  - type: "liqo"
    spec:
      installations:
        - cluster: "rome"
          offloadings: ["no"]
        - cluster: "milan"
        - cluster: "venice"
      peerings:
        - ["rome", "milan"]
        - ["rome", "venice"]
