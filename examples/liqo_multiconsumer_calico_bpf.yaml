default:
  runtime:
    type: "k3d"
  cni: "calico_bpf"
  nodes: 2
  cluster_cidr: "10.200.0.0/16"
  service_cidr: "10.71.0.0/16"

clusters:
  - name: "rome"
    cache: true
    namespaces:
      - name: "nlr"
        pods:
          - name: "plr"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slr"
            spec:
              selector:
                app: plr
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
      - name: "nor"
        pods:
          - name: "porc"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "porp"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
        services:
          - name: "sorc"
            spec:
              selector:
                app: porc
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sorp"
            spec:
              selector:
                app: porp
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
  - name: "milan"
    cache: true
    namespaces:
      - name: "nlm"
        pods:
          - name: "plm"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slm"
            spec:
              selector:
                app: plm
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
  - name: "venice"
    cache: true
    namespaces:
      - name: "nlv"
        pods:
          - name: "plv"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
        services:
          - name: "slv"
            spec:
              selector:
                app: plv
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
      - name: "nov"
        pods:
          - name: "povc"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                tier: worker-0
          - name: "povp"
            spec:
              containers:
                - name: "tester"
                  image: "riccardotornesello/hello-world-http-server:v2.1.0-tester"
                  imagePullPolicy: IfNotPresent
              nodeSelector:
                liqo.io/remote-cluster-id: milan
        services:
          - name: "sovc"
            spec:
              selector:
                app: povc
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
          - name: "sovp"
            spec:
              selector:
                app: povp
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80

tools:
  - type: "liqo"
    spec:
      installations:
        - cluster: "rome"
          offloadings: ["nor"]
        - cluster: "milan"
        - cluster: "venice"
          offloadings: ["nov"]
      peerings:
        - ["rome", "milan"]
        - ["venice", "milan"]
